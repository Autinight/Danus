name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-14
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (all extras)
        run: pip install -e ".[dev]"
      - name: Check shell syntax
        run: |
          for file in scripts/*.sh scripts/tests/*.sh .agents/skills/human-summary/*.sh; do
            bash -n "$file"
          done
      - name: Check platform helpers
        run: |
          bash scripts/tests/test_node_platform.sh
          bash scripts/tests/test_python_runtime.sh
          bash scripts/tests/test_chrome_detection.sh
      - name: Run the offline test suite
        run: python -m pytest danus/ -q
